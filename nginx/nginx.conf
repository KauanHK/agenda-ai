# Proxy de borda do compose: termina na rede `web` e encaminha para o container
# `api` pela rede `backend`. TLS fica no proxy externo da VPS.

server {
    listen 80;
    server_name _;

    # DNS interno do Docker. Resolver em runtime (via variável no proxy_pass)
    # evita que o nginx morra no boot se o `api` ainda não subiu.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 1m;

    location / {
        set $upstream api;
        proxy_pass http://$upstream:8080$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
