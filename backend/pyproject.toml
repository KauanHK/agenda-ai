[project]
name = "agendabot"
version = "0.1.0"
description = "SaaS de agendamentos"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "httpx>=0.28.1",
    "pydantic[email]>=2.13.0",
    "pydantic-settings>=2.13.1",
    "sqlalchemy[asyncio]>=2.0.49",
]

[project.optional-dependencies]
http = [
    "fastapi>=0.135.3",
    "uvicorn>=0.44.0",
    "python-multipart>=0.0.26",
    "python-jose>=3.5.0",
    "passlib>=1.7.4",
    "bcrypt==4.3.0",
]
mcp = [
    "fastmcp>=3.3.1",
]
worker = [
    "celery[redis]>=5.6.3",
]
agent = [
    "langchain-anthropic>=1.7.0",
    "langchain-core>=1.6.1",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-redis>=0.5.2",
    "redis>=7.4.1",
]

[dependency-groups]
dev = [
    "fakeredis>=2.37.1",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
    "ruff>=0.15.12",
    "types-passlib>=1.7.7.20260211",
    "types-python-jose>=3.5.0.20260408",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (ordena imports)
    "N",    # pep8-naming
    "UP",   # pyupgrade (sintaxe moderna)
    "B",    # flake8-bugbear (bugs comuns)
    "C4",   # comprehensions melhores
    "SIM",  # simplificações
    "RUF",  # regras do próprio ruff
]
ignore = [
    "E501",  # line-too-long — o formatter cuida disso
    "B008",  # function-call-in-default-argument — FastAPI usa Depends() em defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # imports não usados em __init__ são ok (re-export)

[tool.ruff.format]
quote-style = "double"


[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

# afrouxando pra projetos reais não morrerem em ruído
warn_return_any = false
disallow_untyped_decorators = false  # FastAPI tem decorators sem tipo

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false  # testes podem ser mais relaxados

# Os construtores do ChatOpenAI e do ChatGroq usam aliases (`model`, `api_key`) que o
# plugin do pydantic não aceita com `init_typed`. No agente-agenda esses providers
# eram extras não instalados no type check; aqui ficam como `Any` do mesmo jeito.
[[tool.mypy.overrides]]
module = ["langchain_openai.*", "langchain_groq.*"]
follow_imports = "skip"


[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
