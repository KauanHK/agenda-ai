services:
  nginx:
    image: nginx:1.27-alpine
    container_name: agenda-bot
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
    expose:
      - "80"
    networks:
      - easypanel
      - backend

  frontend:
    container_name: agenda-bot-front
    image: ghcr.io/${GITHUB_REPOSITORY}-front:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    networks:
      - backend

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: ./backend/.env
    command: >
      sh -c 'redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no'
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    container_name: agenda-bot-api
    image: ghcr.io/${GITHUB_REPOSITORY}-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - egress
    command: >
      sh -c "uv run --no-sync alembic upgrade head &&
             uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"

  worker:
    image: ghcr.io/${GITHUB_REPOSITORY}-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - egress
    command: uv run --no-sync celery -A app.celery_app worker --loglevel=info

  beat:
    image: ghcr.io/${GITHUB_REPOSITORY}-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    command: uv run --no-sync celery -A app.celery_app beat --loglevel=info

networks:
  backend:
    internal: true
  egress:
  easypanel:
    external: true
    name: easypanel

volumes:
  pgdata:
