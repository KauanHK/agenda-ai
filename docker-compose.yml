# ─────────────────────────────────────────────────────────────────────────────
# PRODUÇÃO — VPS + nginx no servidor
#
# As imagens são buildadas e publicadas no GHCR pelo workflow
# .github/workflows/deploy.yml. Na VPS o deploy só faz `docker compose up -d`
# com as imagens já baixadas.
#
# Não há portas publicadas. O container `nginx` deste stack é o único ponto de
# entrada e fica acessível na rede Docker externa `web` como `agenda-bot:80`.
# O nginx do servidor (reverse proxy + HTTPS) precisa estar conectado à mesma
# rede `web` para rotear para ele:
#
#   docker network create web        # uma vez, antes do primeiro up
#   docker network connect web <container-nginx-do-servidor>
#
# Requer na VPS: /opt/agenda-bot/backend/.env  (ver backend/.env.example)
# Para subir/testar localmente use docker-compose.local.yml.
# ─────────────────────────────────────────────────────────────────────────────

x-backend: &backend
  image: ghcr.io/${GITHUB_REPOSITORY}-backend:latest
  build:
    context: ./backend
    dockerfile: Dockerfile
    args:
      BUILDKIT_INLINE_CACHE: "1"
  restart: unless-stopped
  env_file: ./backend/.env
  networks:
    - backend
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: agenda-bot
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy
      frontend:
        condition: service_started
    expose:
      - "80"
    networks:
      - web
      - backend

  frontend:
    container_name: agenda-bot-front
    image: ghcr.io/${GITHUB_REPOSITORY}-front:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    networks:
      - backend

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: ./backend/.env
    command: >
      sh -c 'redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no'
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # roda as migrations uma vez e sai; api/worker/beat só sobem depois disso
  migrate:
    <<: *backend
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: uv run --no-sync alembic upgrade head

  api:
    <<: *backend
    container_name: agenda-bot-api
    networks:
      - backend
      - egress
    command: >
      uv run --no-sync uvicorn app.main:app
      --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips='*'
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # servidor MCP consumido pelo agente de IA durante a inferência
  mcp:
    <<: *backend
    container_name: agenda-bot-mcp
    command: >
      uv run --no-sync uvicorn app.main_mcp:app
      --host 0.0.0.0 --port 8001
      --proxy-headers --forwarded-allow-ips='*'
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *backend
    networks:
      - backend
      - egress
    command: uv run --no-sync celery -A app.celery_app worker --loglevel=info

  beat:
    <<: *backend
    command: uv run --no-sync celery -A app.celery_app beat --loglevel=info

networks:
  backend:
    internal: true
  egress:
  web:
    external: true
    name: web

volumes:
  pgdata:
