# ─────────────────────────────────────────────────────────────────────────────
# DESENVOLVIMENTO LOCAL — stack completa
#
#   docker compose -f docker-compose.local.yml up --build
#
# Tudo é buildado do código-fonte. Ponto de entrada: http://localhost:8080
#   /        → frontend
#   /api/*   → api        (exposta também em http://localhost:8745 p/ Swagger em /docs)
#   /mcp     → mcp        (exposta também em http://localhost:8001/mcp p/ o Inspector)
#   /webhook/ → agent     (exposto também em http://localhost:8002 p/ um túnel HTTPS)
#   db       → localhost:5432   redis → localhost:6379
#
# Segredos (JWT, Google, Evolution, AGENT_SESSION_SECRET) vêm do .env na raiz.
# As variáveis de conexão com db/redis são fixadas abaixo e sobrescrevem o .env.
# ─────────────────────────────────────────────────────────────────────────────

name: agenda-local

x-backend-env: &backend-env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: agenda
  REDIS_URL: redis://redis:6379/0
  REDIS_PASSWORD: ""

x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file: ./.env
  environment: *backend-env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      agent:
        condition: service_healthy
      frontend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agenda
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agenda"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # roda as migrations uma vez e sai
  migrate:
    <<: *backend
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: uv run --no-sync alembic upgrade head

  api:
    <<: *backend
    ports:
      - "8745:8000"
    command: >
      uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000 --root-path /api
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # servidor MCP; exposto em :8001 para apontar o MCP Inspector direto nele
  mcp:
    <<: *backend
    ports:
      - "8001:8001"
    command: >
      uv run --no-sync uvicorn app.main_mcp:app --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # agente de IA do Telegram; exposto em :8002 para um túnel HTTPS (ngrok,
  # cloudflared) receber o webhook e para as rotas /health e /admin
  agent:
    <<: *backend
    environment:
      <<: *backend-env
      AGENT_REDIS__URL: redis://agent-redis:6379/0
      AGENT_AGENDABOT__MCP_URL: http://mcp:8001/mcp
      # a API roda com --root-path /api; pelo nginx o caminho /api/agent/... bate
      AGENT_AGENDABOT__API_URL: http://nginx
    ports:
      - "8002:8002"
    depends_on:
      agent-redis:
        condition: service_healthy
      mcp:
        condition: service_healthy
    command: >
      uv run --no-sync uvicorn app.main_agent:app --host 0.0.0.0 --port 8002
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis 8 do checkpointer do LangGraph (separado do Redis 7 do Celery)
  agent-redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - agentredis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    <<: *backend
    command: uv run --no-sync celery -A app.celery_app worker --loglevel=info

  beat:
    <<: *backend
    command: uv run --no-sync celery -A app.celery_app beat --loglevel=info

volumes:
  pgdata:
  agentredis:
