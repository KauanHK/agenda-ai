name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_frontend: ${{ steps.images.outputs.frontend }}
      image_backend: ${{ steps.images.outputs.backend }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute image names
        id: images
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "frontend=ghcr.io/${repo}-front" >> "$GITHUB_OUTPUT"
          echo "backend=ghcr.io/${repo}-backend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.images.outputs.frontend }}:latest
            ${{ steps.images.outputs.frontend }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.images.outputs.backend }}:latest
            ${{ steps.images.outputs.backend }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Copia arquivos de infra para a VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,nginx.conf"
          target: /opt/agenda-bot

      - uses: appleboy/ssh-action@v1
        env:
          IMAGE_FRONTEND: ${{ needs.build.outputs.image_frontend }}
          IMAGE_BACKEND: ${{ needs.build.outputs.image_backend }}
          NEW_TAG: sha-${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_FRONTEND,IMAGE_BACKEND,NEW_TAG,GH_TOKEN,GH_ACTOR,GITHUB_REPOSITORY
          script: |
            cd /opt/agenda-bot

            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            docker tag "${IMAGE_FRONTEND}:latest" "${IMAGE_FRONTEND}:rollback" 2>/dev/null || true
            docker tag "${IMAGE_BACKEND}:latest" "${IMAGE_BACKEND}:rollback" 2>/dev/null || true

            docker pull "${IMAGE_FRONTEND}:${NEW_TAG}"
            docker pull "${IMAGE_BACKEND}:${NEW_TAG}"

            docker tag "${IMAGE_FRONTEND}:${NEW_TAG}" "${IMAGE_FRONTEND}:latest"
            docker tag "${IMAGE_BACKEND}:${NEW_TAG}" "${IMAGE_BACKEND}:latest"

            docker compose up -d --force-recreate --remove-orphans
