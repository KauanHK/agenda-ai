server {
    listen       80;
    server_name  _;

    # DNS embutido do Docker, com o upstream em variável: o nginx resolve o nome a
    # cada requisição. Sem isso ele resolve uma vez ao carregar a config, não sobe
    # se o upstream ainda não existir e guarda o IP antigo quando o container é
    # recriado.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Servidor MCP. O agente de IA (OpenAI) o alcança durante a inferência, então
    # precisa estar publicamente acessível via HTTPS. A autorização é o token de
    # sessão do cliente, validado pelo próprio servidor MCP.
    location /mcp {
        set $mcp_upstream agenda-bot-mcp:8001;
        proxy_pass http://$mcp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # streamable-http mantém a resposta aberta; sem isso o nginx bufferiza
        # e o cliente MCP fica esperando.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Webhook do Telegram para o agente de IA. Só /webhook/ é público: /health e
    # /admin/telegram/webhook do agente ficam na rede interna (use `docker compose exec`).
    location /webhook/ {
        set $agent_upstream agenda-bot-agent:8002;
        proxy_pass http://$agent_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A API roda com --root-path /api, então o Swagger em /api/docs busca
    # /api/openapi.json (e /api/redoc). O nginx tira o prefixo /api/ ao repassar.
    location = /api {
        return 308 /api/docs;
    }

    location /api/ {
        # Com variável, o proxy_pass não troca o prefixo: quem tira o /api é o rewrite.
        set $api_upstream agenda-bot-api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $front_upstream agenda-bot-front:3914;
        proxy_pass http://$front_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
